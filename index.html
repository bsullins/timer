<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ben's Tabata Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <main class="layout">
        <section class="stage" aria-live="polite">
          <button
            class="menu-btn"
            id="menuBtn"
            type="button"
            aria-expanded="false"
            aria-controls="setupPanel"
            aria-label="Toggle setup"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
          <div class="phase" id="phaseLabel">Idle</div>
          <div class="time" id="timeDisplay">00:00</div>
          <div class="round" id="roundLabel">Round 0 of 0</div>
          <div class="progress" aria-hidden="true">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="actions">
            <button class="btn primary" id="startBtn">Start</button>
            <button class="btn ghost" id="pauseBtn" disabled>Pause</button>
            <button class="btn ghost" id="resetBtn">Reset</button>
          </div>
          <section id="golfGuide" hidden aria-label="Current golf stretch">
            <div id="golfDrawing"></div>
            <p class="label" id="golfSide"></p>
            <h2 id="golfTitle"></h2>
            <p id="golfDescription"></p>
            <a id="golfDemo" target="_blank" rel="noopener">Watch this movement ↗</a>
            <div class="actions golf-navigation">
              <button class="btn ghost" id="golfPrevious" aria-label="Previous stretch">← Previous</button>
              <button class="btn ghost" id="golfNext" aria-label="Next stretch">Next →</button>
            </div>
            <p class="hint">17 segments · 20:44. Follows <a href="https://www.youtube.com/watch?v=PO2CMKSD6NE" target="_blank" rel="noopener">Tom Merrick’s golf mobility routine</a>. Timing includes setup and transitions. Optional cushions or blocks can support positions.</p>
          </section>
          <div class="presets presets-inline">
            <p class="label">Presets</p>
            <div class="preset-list">
              <button
                class="btn ghost"
                type="button"
                data-preset
                data-rounds="8"
                data-work="20"
                data-rest="10"
              >
                Workout
              </button>
              <button
                class="btn ghost"
                type="button"
                data-preset
                data-rounds="5"
                data-work="60"
                data-rest="10"
              >
                Stretching
              </button>
              <button
                class="btn ghost"
                type="button"
                data-preset
                data-rounds="8"
                data-work="120"
                data-rest="10"
              >
                Long stretch
              </button>
              <button class="btn ghost" type="button" id="golfPreset" aria-pressed="false">Golf stretch</button>
            </div>
          </div>
        </section>

        <aside class="panel" id="setupPanel">
          <div class="panel-header">
            <h2>Setup</h2>
            <button class="panel-close" id="panelCloseBtn" type="button" aria-label="Close setup">
              X
            </button>
          </div>
          <div class="grid">
            <label class="field">
              <span>Rounds</span>
              <input id="roundsInput" type="number" min="1" max="50" step="1" value="5" />
            </label>
            <label class="field">
              <span>Work (sec)</span>
              <input id="workInput" type="number" min="1" max="600" step="1" value="60" />
            </label>
            <label class="field">
              <span>Rest (sec)</span>
              <input id="restInput" type="number" min="0" max="600" step="1" value="10" />
            </label>
            <label class="field">
              <span>Beep volume</span>
              <input id="volumeInput" type="range" min="0" max="1" step="0.05" value="0.6" />
            </label>
          </div>

          <div class="toggles">
            <label class="toggle">
              <input id="soundToggle" type="checkbox" checked />
              <span>Sound cues</span>
            </label>
            <label class="toggle">
              <input id="vibrateToggle" type="checkbox" />
              <span>Vibrate cues</span>
            </label>
          </div>

          <div class="meta">
            <p id="totalTime">Total time: 00:00</p>
            <p class="hint">Sound starts after a button press.</p>
          </div>
        </aside>
        <div class="panel-backdrop" id="panelBackdrop"></div>
      </main>
    </div>

    <script src="golf.js"></script>
    <script src="app.js"></script>
  </body>
</html>
